name: Daily Blogger Backlink Posts (30 Posts)

on:
  # 定时执行：每天 UTC 03:00（即北京时间每天上午 11:00 自动运行）
  schedule:
    - cron: '0 3 * * *'

  # 支持在 GitHub 网页上手动一键立即运行测试
  workflow_dispatch:

jobs:
  publish-blogger-posts:
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_NODE_24: "true"

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 自动发布 30 篇外链博文至 Blogger
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python daily_blogger_posts.py
